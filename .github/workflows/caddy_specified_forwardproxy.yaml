name: Caddy Stable Build

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Prepare Forwardproxy Source
        run: |
          git clone -b naive --depth=1 https://github.com/klzgrad/forwardproxy.git .forwardproxy-src
          git clone --depth=1 --branch "v2.11.7" https://github.com/caddyserver/caddy.git .caddy-bbr

          curl -sL https://raw.githubusercontent.com/klzgrad/forwardproxy/naive/caddy-sing-quic-bbrv1.patch -o caddy-sing-quic-bbrv1.patch || true
          curl -sL https://raw.githubusercontent.com/klzgrad/forwardproxy/naive/caddy-read-idle-timeout.patch -o caddy-read-idle-timeout.patch || true

          if [ -f "caddy-sing-quic-bbrv1.patch" ] && [ -s "caddy-sing-quic-bbrv1.patch" ]; then
            git -C .caddy-bbr apply "$GITHUB_WORKSPACE/caddy-sing-quic-bbrv1.patch"
          fi
          if [ -f "caddy-read-idle-timeout.patch" ] && [ -s "caddy-read-idle-timeout.patch" ]; then
            git -C .caddy-bbr apply "$GITHUB_WORKSPACE/caddy-read-idle-timeout.patch"
          fi


      - name: Build Binaries
        id: build_info
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          
          XCADDY_LDFLAGS="-s -w" ~/go/bin/xcaddy build --replace "github.com/caddyserver/caddy/v2=$GITHUB_WORKSPACE/.caddy-bbr" --with github.com/caddyserver/forwardproxy=$GITHUB_WORKSPACE/.forwardproxy-src --with github.com/mholt/caddy-l4
          chmod +x caddy
          ZSTD_CLEVEL=19 tar cvfa caddy_linux_amd64.tar.zst caddy
          
          echo "cv=$(./caddy version | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "gv=$(go version | awk '{print $3}')" >> $GITHUB_OUTPUT
          
          export GOARCH=amd64 GOOS=windows
          XCADDY_LDFLAGS="-s -w" ~/go/bin/xcaddy build --replace "github.com/caddyserver/caddy/v2=$GITHUB_WORKSPACE/.caddy-bbr" --with github.com/caddyserver/forwardproxy=$GITHUB_WORKSPACE/.forwardproxy-src --with github.com/mholt/caddy-l4 --output ./caddy.exe
          zip -9 caddy_windows_amd64.zip caddy.exe


      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy:latest
            ghcr.io/${{ github.repository_owner }}/caddy:${{ steps.build_info.outputs.cv }}
          no-cache: true
          #cache-from: type=gha
          #cache-to: type=gha,mode=max

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Caddy ${{ steps.build_info.outputs.cv }} (Go ${{ steps.build_info.outputs.gv }})
          tag_name: ${{ steps.date.outputs.date }}-v${{ steps.build_info.outputs.cv }}
          files: |
            caddy_linux_amd64.tar.zst
            caddy_windows_amd64.zip
